<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="80" fill="#09090b"/>
  <!-- QR-like pattern -->
  <g fill="#d7ba52">
    <!-- Top-left finder -->
    <rect x="80" y="80" width="120" height="120" rx="8"/>
    <rect x="96" y="96" width="88" height="88" rx="4" fill="#09090b"/>
    <rect x="112" y="112" width="56" height="56" rx="4" fill="#d7ba52"/>
    <!-- Top-right finder -->
    <rect x="312" y="80" width="120" height="120" rx="8"/>
    <rect x="328" y="96" width="88" height="88" rx="4" fill="#09090b"/>
    <rect x="344" y="112" width="56" height="56" rx="4" fill="#d7ba52"/>
    <!-- Bottom-left finder -->
    <rect x="80" y="312" width="120" height="120" rx="8"/>
    <rect x="96" y="328" width="88" height="88" rx="4" fill="#09090b"/>
    <rect x="112" y="344" width="56" height="56" rx="4" fill="#d7ba52"/>
    <!-- Data dots -->
    <rect x="232" y="80" width="32" height="32" rx="4"/>
    <rect x="232" y="136" width="32" height="32" rx="4"/>
    <rect x="232" y="232" width="48" height="48" rx="6"/>
    <rect x="312" y="232" width="32" height="32" rx="4"/>
    <rect x="368" y="232" width="32" height="32" rx="4"/>
    <rect x="80" y="232" width="32" height="32" rx="4"/>
    <rect x="136" y="232" width="32" height="32" rx="4"/>
    <rect x="312" y="312" width="32" height="32" rx="4"/>
    <rect x="368" y="312" width="32" height="32" rx="4"/>
    <rect x="312" y="368" width="32" height="32" rx="4"/>
    <rect x="400" y="368" width="32" height="32" rx="4"/>
    <rect x="368" y="400" width="32" height="32" rx="4"/>
  </g>
</svg>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#09090b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="My QR Card" />
    <link rel="manifest" href="/qr-manifest.json" />
    <link rel="icon" href="/CC_blackbg.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/CC_blackbg.svg" />
    <title>My QR Card</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/qr-code-styling@1.6.0/lib/qr-code-styling.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #09090b;
            --surface: #18181b;
            --border: #27272a;
            --gold: #d7ba52;
            --gold-dim: rgba(215, 186, 82, 0.15);
            --text: #fafafa;
            --text-muted: #a1a1aa;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Subtle radial glow behind QR */
        .qr-glow {
            position: relative;
        }

        .qr-glow::before {
            content: '';
            position: absolute;
            inset: -40px;
            background: radial-gradient(circle, var(--gold-dim) 0%, transparent 70%);
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
        }

        .qr-card {
            position: relative;
            z-index: 1;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(215, 186, 82, 0.05);
        }

        #qr-code {
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #qr-code canvas,
        #qr-code svg {
            border-radius: 16px;
            max-width: 100%;
            height: auto;
        }

        .user-name {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.02em;
            text-align: center;
        }

        .profile-url {
            font-size: 12px;
            color: var(--text-muted);
            text-align: center;
            letter-spacing: 0.02em;
            word-break: break-all;
        }

        .branding {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 10px;
            color: var(--text-muted);
            letter-spacing: 0.05em;
            text-transform: uppercase;
            opacity: 0.6;
        }

        .branding svg {
            width: 14px;
            height: 14px;
            fill: var(--gold);
        }

        .install-btn {
            display: none;
            width: 100%;
            padding: 14px 24px;
            background: var(--gold);
            color: #09090b;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 0.01em;
        }

        .install-btn:hover {
            background: #c5aa40;
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(215, 186, 82, 0.25);
        }

        .install-btn:active {
            transform: scale(0.98);
        }

        .install-btn.visible {
            display: block;
        }

        .share-btn {
            width: 100%;
            padding: 12px 24px;
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .share-btn:hover {
            color: var(--text);
            border-color: var(--gold);
        }

        .offline-badge {
            display: none;
            padding: 6px 14px;
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.2);
            border-radius: 100px;
            font-size: 10px;
            font-weight: 700;
            color: #4ade80;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .offline-badge.visible {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="offline-badge" id="offline-badge">
            <span style="width:6px;height:6px;border-radius:50%;background:#4ade80;"></span>
            Available Offline
        </div>

        <div class="qr-glow">
            <div class="qr-card">
                <div id="qr-code"></div>
            </div>
        </div>

        <div class="user-name" id="user-name">Loading...</div>
        <div class="profile-url" id="profile-url"></div>

        <button class="install-btn" id="install-btn">
            📲 Add to Home Screen
        </button>

        <button class="share-btn" id="share-btn" style="display:none;">
            Share QR Code
        </button>

        <div class="branding">
            <svg viewBox="0 0 24 24">
                <path
                    d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z" />
            </svg>
            NFC cards by CanopyCorp
        </div>
    </div>

    <script>
        // --- Parse URL params with localStorage persistence ---
        const params = new URLSearchParams(window.location.search);
        let slug = params.get('slug') || '';
        let name = params.get('name') || '';

        // If we have URL params, save them to localStorage for offline/installed use
        if (slug) {
            localStorage.setItem('qr_widget_slug', slug);
            localStorage.setItem('qr_widget_name', name || 'My Profile');
        } else {
            // No URL params (likely opened from home screen) — read from localStorage
            slug = localStorage.getItem('qr_widget_slug') || '';
            name = localStorage.getItem('qr_widget_name') || 'My Profile';
        }

        if (!name) name = 'My Profile';
        const profileUrl = slug ? `https://canopycorp.in/#/p/${slug}` : '';

        // --- Update UI ---
        document.getElementById('user-name').textContent = decodeURIComponent(name);
        document.getElementById('profile-url').textContent = profileUrl || 'No profile configured';
        document.title = slug ? `${decodeURIComponent(name)} - QR Card` : 'QR Card';

        // --- Update manifest start_url dynamically ---
        // We need to update the manifest link to include the slug
        const manifestLink = document.querySelector('link[rel="manifest"]');
        const manifestUrl = `/qr-manifest.json`;
        // Note: start_url in manifest is static, but the actual page URL has the params cached by SW

        // --- Generate QR Code ---
        if (slug) {
            const qrSize = Math.min(window.innerWidth - 96, 280);
            const qrCode = new QRCodeStyling({
                width: qrSize,
                height: qrSize,
                data: profileUrl,
                dotsOptions: {
                    color: "#d7ba52",
                    type: "rounded"
                },
                backgroundOptions: {
                    color: "#09090b"
                },
                cornersSquareOptions: {
                    color: "#d7ba52",
                    type: "extra-rounded"
                },
                cornersDotOptions: {
                    color: "#d7ba52",
                    type: "dot"
                },
                imageOptions: {
                    crossOrigin: "anonymous",
                    margin: 4
                }
            });
            qrCode.append(document.getElementById('qr-code'));
        } else {
            document.getElementById('qr-code').innerHTML =
                '<p style="color:#a1a1aa;padding:40px;text-align:center;">No profile configured. Please open from your Dashboard first.</p>';
        }

        // --- Service Worker ---
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/qr-sw.js')
                .then((reg) => {
                    console.log('QR SW registered:', reg.scope);
                    // Show offline badge if SW is active
                    if (reg.active) {
                        document.getElementById('offline-badge').classList.add('visible');
                    }
                    reg.addEventListener('statechange', () => {
                        if (reg.active) {
                            document.getElementById('offline-badge').classList.add('visible');
                        }
                    });
                })
                .catch((err) => console.error('SW registration failed:', err));

            // Also show badge if already controlled
            if (navigator.serviceWorker.controller) {
                document.getElementById('offline-badge').classList.add('visible');
            }
        }

        // --- Install Prompt (A2HS) ---
        let deferredPrompt = null;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('install-btn').classList.add('visible');
        });

        document.getElementById('install-btn').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                console.log('Install outcome:', outcome);
                deferredPrompt = null;
                document.getElementById('install-btn').classList.remove('visible');
            } else {
                // Fallback: Show manual instructions
                const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
                if (isIOS) {
                    alert('To add to Home Screen:\n1. Tap the Share button (bottom bar)\n2. Scroll down and tap "Add to Home Screen"');
                } else {
                    alert('To add to Home Screen:\n1. Open browser menu (⋮)\n2. Tap "Add to Home Screen" or "Install"');
                }
            }
        });

        // Show install button on iOS (no beforeinstallprompt event)
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
        const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
        if (isIOS && !isStandalone) {
            document.getElementById('install-btn').classList.add('visible');
        }

        // Hide install button if launched from home screen
        if (isStandalone) {
            document.getElementById('install-btn').style.display = 'none';
        }

        // --- Web Share API ---
        if (navigator.share) {
            const shareBtn = document.getElementById('share-btn');
            shareBtn.style.display = 'block';
            shareBtn.addEventListener('click', () => {
                navigator.share({
                    title: `${decodeURIComponent(name)}'s Profile`,
                    text: `Check out ${decodeURIComponent(name)}'s digital profile`,
                    url: profileUrl
                }).catch(() => { });
            });
        }
    </script>
</body>

</html>

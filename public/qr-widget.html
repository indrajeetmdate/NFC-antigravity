<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#09090b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Canopy QR" />
    <link rel="manifest" href="/qr-manifest.json" />
    <link rel="icon" href="/CC_blackbg.png" type="image/png" />
    <link rel="apple-touch-icon" href="/CC_blackbg.png" />
    <title>Canopy QR</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/qr-code-styling@1.6.0/lib/qr-code-styling.js"></script>
    <script src="https://unpkg.com/jsqr@1.4.0/dist/jsQR.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #09090b;
            --surface: #18181b;
            --border: #27272a;
            --gold: #d7ba52;
            --gold-dim: rgba(215, 186, 82, 0.15);
            --gold-glow: rgba(215, 186, 82, 0.08);
            --text: #fafafa;
            --text-muted: #a1a1aa;
            --text-dim: #71717a;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        /* ── Header ── */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .header-title {
            font-size: 16px;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: var(--gold);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 10px;
            background: rgba(34, 197, 94, 0.08);
            border: 1px solid rgba(34, 197, 94, 0.15);
            border-radius: 100px;
            font-size: 9px;
            font-weight: 700;
            color: #4ade80;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .badge-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #4ade80;
        }

        /* ── Main QR Area ── */
        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            gap: 16px;
            position: relative;
            overflow: hidden;
        }

        .qr-glow {
            position: relative;
        }

        .qr-glow::before {
            content: '';
            position: absolute;
            inset: -50px;
            background: radial-gradient(circle, var(--gold-glow) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .qr-card {
            position: relative;
            z-index: 1;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            transition: transform 0.15s ease, opacity 0.15s ease;
        }

        .qr-card.swapping {
            transform: scale(0.92);
            opacity: 0.3;
        }

        #qr-code {
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        #qr-code canvas,
        #qr-code svg {
            border-radius: 16px;
            max-width: 100%;
            height: auto;
        }

        /* QR Center Icon Overlay */
        .qr-icon-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            background: var(--bg);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        .qr-icon-overlay svg {
            width: 22px;
            height: 22px;
        }

        .qr-label {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.02em;
            text-align: center;
            transition: opacity 0.15s ease;
        }

        .qr-sublabel {
            font-size: 11px;
            color: var(--text-muted);
            text-align: center;
            word-break: break-all;
            max-width: 300px;
            transition: opacity 0.15s ease;
        }

        /* ── Bottom Tray ── */
        .tray-wrapper {
            flex-shrink: 0;
            border-top: 1px solid var(--border);
            background: var(--surface);
            padding: 12px 0 calc(12px + env(safe-area-inset-bottom, 0px));
        }

        .tray {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 16px;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .tray::-webkit-scrollbar {
            display: none;
        }

        .tray-item {
            flex-shrink: 0;
            width: 52px;
            height: 52px;
            border-radius: 16px;
            background: var(--bg);
            border: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .tray-item:active {
            transform: scale(0.9);
        }

        .tray-item.active {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px var(--gold-dim), 0 4px 12px rgba(215, 186, 82, 0.15);
        }

        .tray-item svg {
            width: 24px;
            height: 24px;
            color: var(--text-muted);
        }

        .tray-item.active svg {
            color: var(--gold);
        }

        .tray-item-label {
            position: absolute;
            bottom: -16px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 8px;
            font-weight: 600;
            color: var(--text-dim);
            white-space: nowrap;
            letter-spacing: 0.02em;
        }

        .tray-item.active .tray-item-label {
            color: var(--gold);
        }

        /* Add Button */
        .add-btn {
            flex-shrink: 0;
            width: 52px;
            height: 52px;
            border-radius: 16px;
            background: var(--gold-dim);
            border: 2px dashed var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            opacity: 0.7;
        }

        .add-btn:hover,
        .add-btn:active {
            opacity: 1;
            transform: scale(0.95);
        }

        .add-btn svg {
            width: 22px;
            height: 22px;
            color: var(--gold);
        }

        /* ── Add QR Picker Panel ── */
        .picker-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            z-index: 50;
            display: none;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .picker-overlay.show {
            display: block;
            opacity: 1;
        }

        .picker-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--surface);
            border-top: 1px solid var(--border);
            border-radius: 24px 24px 0 0;
            padding: 20px 16px calc(20px + env(safe-area-inset-bottom, 0px));
            z-index: 51;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
        }

        .picker-panel.show {
            transform: translateY(0);
        }

        .picker-handle {
            width: 36px;
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            margin: 0 auto 16px;
        }

        .picker-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 16px;
            text-align: center;
        }

        .picker-grid {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 8px;
            scrollbar-width: none;
        }

        .picker-grid::-webkit-scrollbar {
            display: none;
        }

        .picker-option {
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: transform 0.15s ease;
        }

        .picker-option:active {
            transform: scale(0.9);
        }

        .picker-icon {
            width: 52px;
            height: 52px;
            border-radius: 16px;
            background: var(--bg);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: border-color 0.15s ease;
        }

        .picker-option:hover .picker-icon {
            border-color: var(--gold);
        }

        .picker-icon svg {
            width: 24px;
            height: 24px;
            color: var(--gold);
        }

        .picker-label {
            font-size: 9px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        /* ── Input Modal ── */
        .input-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(6px);
            z-index: 60;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .input-modal.show {
            display: flex;
        }

        .input-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 28px 24px;
            width: 100%;
            max-width: 340px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .input-card h3 {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .input-card p {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        .input-field {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 14px;
            color: var(--text);
            outline: none;
            font-family: inherit;
            margin-bottom: 8px;
            transition: border-color 0.15s ease;
        }

        .input-field:focus {
            border-color: var(--gold);
        }

        .input-field::placeholder {
            color: var(--text-dim);
        }

        .input-actions {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }

        .btn-save {
            flex: 1;
            padding: 12px;
            background: var(--gold);
            color: var(--bg);
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn-save:active {
            transform: scale(0.97);
        }

        .btn-cancel {
            padding: 12px 16px;
            background: transparent;
            color: var(--text-dim);
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        /* ── Delete Hint ── */
        .delete-hint {
            font-size: 10px;
            color: var(--text-dim);
            text-align: center;
            padding-top: 4px;
            opacity: 0.6;
        }

        /* ── Install Banner ── */
        .install-banner {
            display: none;
            padding: 10px 16px;
            background: var(--gold-dim);
            border-bottom: 1px solid rgba(215, 186, 82, 0.2);
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .install-banner.show {
            display: flex;
        }

        .install-banner span {
            font-size: 12px;
            font-weight: 600;
            color: var(--gold);
        }

        .install-banner button {
            background: var(--gold);
            color: var(--bg);
            border: none;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }

        /* ── QR Scanner ── */
        .scan-btn {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: var(--gold-dim);
            border: 1px solid rgba(215, 186, 82, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s ease;
            color: var(--gold);
        }

        .scan-btn:active {
            transform: scale(0.9);
        }

        .scan-btn svg {
            width: 20px;
            height: 20px;
        }

        .scanner-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 80;
            display: none;
            flex-direction: column;
        }

        .scanner-overlay.show {
            display: flex;
        }

        .scanner-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .scanner-header span {
            font-size: 15px;
            font-weight: 700;
            color: var(--gold);
        }

        .scanner-close {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 6px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .scanner-viewport {
            flex: 1;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        .scanner-viewport video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .scanner-viewport canvas {
            display: none;
        }

        .scanner-frame {
            position: absolute;
            width: 220px;
            height: 220px;
            border: 2px solid var(--gold);
            border-radius: 20px;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);
            pointer-events: none;
        }

        .scanner-frame::after {
            content: '';
            position: absolute;
            inset: -6px;
            border: 3px solid var(--gold);
            border-radius: 24px;
            opacity: 0.3;
        }

        .scanner-hint {
            position: absolute;
            bottom: 40px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .scanner-result {
            position: absolute;
            bottom: 80px;
            left: 16px;
            right: 16px;
            background: var(--surface);
            border: 1px solid var(--gold);
            border-radius: 16px;
            padding: 14px 16px;
            display: none;
        }

        .scanner-result.show {
            display: block;
        }

        .scanner-result-text {
            font-size: 12px;
            color: var(--text);
            word-break: break-all;
            margin-bottom: 10px;
        }

        .scanner-result-btn {
            background: var(--gold);
            color: var(--bg);
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        /* ── Install Modal ── */
        .install-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(8px);
            z-index: 70;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .install-modal.show {
            display: flex;
        }

        .install-modal-card {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 32px 24px;
            border-radius: 28px;
            text-align: center;
            max-width: 92%;
            width: 320px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        }

        .install-modal-card img {
            width: 72px;
            height: 72px;
            border-radius: 18px;
            margin-bottom: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .install-modal-card h2 {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .install-modal-card p {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .install-modal-primary {
            background: var(--gold);
            color: var(--bg);
            border: none;
            padding: 14px 0;
            width: 100%;
            border-radius: 14px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            margin-bottom: 10px;
            transition: transform 0.1s;
        }

        .install-modal-primary:active {
            transform: scale(0.97);
        }

        .install-modal-dismiss {
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 13px;
            cursor: pointer;
        }

        /* ── QR Action Buttons ── */
        .qr-actions {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 300px;
        }

        .qr-action-btn {
            flex: 1;
            padding: 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.15s ease;
            border: none;
        }

        .qr-action-btn:active {
            transform: scale(0.95);
        }

        .qr-action-btn.open-btn {
            background: var(--gold);
            color: var(--bg);
        }

        .qr-action-btn.share-btn {
            background: var(--surface);
            color: var(--text-muted);
            border: 1px solid var(--border);
        }

        .qr-action-btn svg {
            width: 16px;
            height: 16px;
        }

        /* ── Scanner Result Buttons ── */
        .scanner-actions {
            display: flex;
            gap: 8px;
        }

        .scanner-actions button {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            border: none;
        }

        .scanner-save-btn {
            background: var(--gold);
            color: var(--bg);
        }

        .scanner-open-btn {
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border) !important;
        }

        /* ── Animations ── */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .animate-in {
            animation: fadeIn 0.4s ease-out;
        }
    </style>
</head>

<body>
    <!-- Header -->
    <div class="header">
        <span class="header-title">Canopy QR</span>
        <div style="display:flex;align-items:center;gap:8px;">
            <div class="badge" id="offline-badge" style="display:none;">
                <span class="badge-dot"></span>
                Offline Ready
            </div>
            <button class="scan-btn" id="scan-btn" title="Scan QR">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="M4 7V4h3" />
                    <path d="M20 7V4h-3" />
                    <path d="M4 17v3h3" />
                    <path d="M20 17v3h-3" />
                    <rect x="7" y="7" width="10" height="10" rx="1" />
                    <line x1="12" y1="7" x2="12" y2="17" />
                </svg>
            </button>
        </div>
    </div>

    <!-- QR Scanner Overlay -->
    <div class="scanner-overlay" id="scanner-overlay">
        <div class="scanner-header">
            <span>Scan QR Code</span>
            <button class="scanner-close" id="scanner-close">Close</button>
        </div>
        <div class="scanner-viewport">
            <video id="scanner-video" autoplay playsinline muted></video>
            <canvas id="scanner-canvas"></canvas>
            <div class="scanner-frame"></div>
            <div class="scanner-hint">Point at a QR code</div>
            <div class="scanner-result" id="scanner-result">
                <div class="scanner-result-text" id="scanner-result-text"></div>
                <div class="scanner-actions">
                    <button class="scanner-save-btn" id="scanner-result-save">💾 Save to Tray</button>
                    <button class="scanner-open-btn" id="scanner-result-open">🔗 Open</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Install Modal (auto-show) -->
    <div class="install-modal" id="install-modal">
        <div class="install-modal-card">
            <img src="/CC_blackbg.png" alt="Canopy QR" />
            <h2>Install Canopy QR</h2>
            <p>Add to your Home Screen for instant offline access to all your QR codes.</p>
            <button class="install-modal-primary" id="install-modal-btn">Install App</button>
            <button class="install-modal-dismiss" id="install-modal-dismiss">Not Now</button>
        </div>
    </div>

    <!-- Main QR Display -->
    <div class="main-area animate-in">
        <div class="qr-glow">
            <div class="qr-card" id="qr-card">
                <div id="qr-code"></div>
                <div class="qr-icon-overlay" id="qr-overlay" style="display:none;"></div>
            </div>
        </div>
        <div class="qr-label" id="qr-label">Loading...</div>
        <div class="qr-sublabel" id="qr-sublabel"></div>
        <div class="qr-actions" id="qr-actions" style="display:none;">
            <button class="qr-action-btn open-btn" id="qr-open-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6" />
                    <polyline points="15 3 21 3 21 9" />
                    <line x1="10" y1="14" x2="21" y2="3" />
                </svg>
                Open
            </button>
            <button class="qr-action-btn share-btn" id="qr-share-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <circle cx="18" cy="5" r="3" />
                    <circle cx="6" cy="12" r="3" />
                    <circle cx="18" cy="19" r="3" />
                    <line x1="8.59" y1="13.51" x2="15.42" y2="17.49" />

                Share

    </div>

    <!-- Bottom Tray -->
    <div class="tray-wrapper">
        <div class="tray" id="tray"></div>
    </div>

    <!-- Add QR Picker Overlay -->
    <div class="picker-overlay" id="picker-overlay"></div>
    <div class="picker-panel" id="picker-panel">
        <div class="picker-handle"></div>
        <div class="picker-title">+ Add QR Code</div>
        <div class="picker-grid" id="picker-grid"></div>

    <!-- Input Modal -->
    <div class="input-modal" id="input-modal">
        <div class="input-card">
            <h3 id="input-title">Add QR</h3>
            <p id="input-subtitle">Paste the URL or text to encode</p>
            <input class="input-field" id="input-label" placeholder="Label (e.g., My Instagram)" maxlength="24" />

            <div class="input-actions">
                <button class="btn-cancel" id="input-cancel">Cancel</button>
                <button class="btn-save" id="input-save">Save QR</button>
            </div>
        </div>
    </div>

    <script>
        // ═══════════════════════════════════════════════
        // APP ICON SVGs (inline, minimal, single-color)
        // ═══════════════════════════════════════════════
        const ICONS = {
            canopy: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>`,

            youtube: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M23.498 6.186a3.016 3.016 0 00-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 00.502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 002.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 002.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>`,
            linkedin: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>`,

            website: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>`,
            custom: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/></svg>`,
            facebook: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>`,
            twitter: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>`,
            maps: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>`,
        };

        // Picker presets
        const PRESETS = [
            { key: 'whatsapp', label: 'WhatsApp', placeholder: 'https://wa.me/91...' },
            { key: 'instagram', label: 'Instagram', placeholder: 'https://instagram.com/...' },
            { key: 'youtube', label: 'YouTube', placeholder: 'https://youtube.com/...' },
            { key: 'linkedin', label: 'LinkedIn', placeholder: 'https://linkedin.com/in/...' },
            { key: 'upi', label: 'UPI', placeholder: 'upi://pay?pa=...' },
            { key: 'facebook', label: 'Facebook', placeholder: 'https://facebook.com/...' },
            { key: 'twitter', label: 'X/Twitter', placeholder: 'https://x.com/...' },
            { key: 'maps', label: 'Maps', placeholder: 'https://maps.google.com/...' },
            { key: 'wifi', label: 'WiFi', placeholder: 'WIFI:T:WPA;S:MyNet;P:pass;;' },
            { key: 'website', label: 'Website', placeholder: 'https://...' },
            { key: 'custom', label: 'Custom', placeholder: 'Any URL or text...' },
        ];

        // ═══════════════════════════════════════════════
        // IndexedDB Wrapper
        // ═══════════════════════════════════════════════
        const DB_NAME = 'canopyQRTray';
        const DB_STORE = 'qr_codes';
        let db = null;

        function openDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME, 1);
                req.onupgradeneeded = (e) => {
                    const d = e.target.result;
                    if (!d.objectStoreNames.contains(DB_STORE)) {
                        d.createObjectStore(DB_STORE, { keyPath: 'id' });
                    }
                };
                req.onsuccess = (e) => { db = e.target.result; resolve(db); };
                req.onerror = (e) => reject(e);
            });
        }

        function dbGetAll() {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(DB_STORE, 'readonly');
                const store = tx.objectStore(DB_STORE);
                const req = store.getAll();
                req.onsuccess = () => resolve(req.result || []);
                req.onerror = () => reject(req.error);
            });
        }

        function dbPut(item) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(DB_STORE, 'readwrite');
                const store = tx.objectStore(DB_STORE);
                const req = store.put(item);
                req.onsuccess = () => resolve();
                req.onerror = () => reject(req.error);
            });
        }

        function dbDelete(id) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(DB_STORE, 'readwrite');
                const store = tx.objectStore(DB_STORE);
                const req = store.delete(id);
                req.onsuccess = () => resolve();
                req.onerror = () => reject(req.error);
            });
        }

        // ═══════════════════════════════════════════════
        // App State
        // ═══════════════════════════════════════════════
        let allQRs = [];
        let activeId = null;
        let currentQRInstance = null;
        let selectedPreset = null;
        let longPressTimer = null;

        // ═══════════════════════════════════════════════
        // QR Rendering
        // ═══════════════════════════════════════════════
        function renderMainQR(qr) {
            const card = document.getElementById('qr-card');
            const codeEl = document.getElementById('qr-code');
            const overlay = document.getElementById('qr-overlay');
            const label = document.getElementById('qr-label');
            const sublabel = document.getElementById('qr-sublabel');

            // Swap animation
            card.classList.add('swapping');

            setTimeout(() => {
                // Clear old QR
                codeEl.innerHTML = '';
                overlay.style.display = 'none';

                if (!qr || !qr.url) {
                    label.textContent = 'No QR Selected';
                    sublabel.textContent = 'Tap + to add a QR code';
                    card.classList.remove('swapping');
                    return;
                }

                const qrSize = Math.min(window.innerWidth - 96, 240);
                currentQRInstance = new QRCodeStyling({
                    width: qrSize,
                    height: qrSize,
                    data: qr.url,
                    dotsOptions: { color: '#d7ba52', type: 'rounded' },
                    backgroundOptions: { color: '#09090b' },
                    cornersSquareOptions: { color: '#d7ba52', type: 'extra-rounded' },
                    cornersDotOptions: { color: '#d7ba52', type: 'dot' },
                    imageOptions: { crossOrigin: 'anonymous', margin: 4 }
                });
                currentQRInstance.append(codeEl);

                // Show icon overlay
                const icon = ICONS[qr.icon] || ICONS.custom;
                overlay.innerHTML = icon;
                overlay.style.display = 'flex';
                overlay.style.color = '#d7ba52';

                label.textContent = qr.label || 'QR Code';
                sublabel.textContent = qr.url.length > 50 ? qr.url.substring(0, 50) + '...' : qr.url;

                // Show action buttons
                const actions = document.getElementById('qr-actions');
                actions.style.display = 'flex';

                card.classList.remove('swapping');
            }, 150);
        }

        // QR Action Buttons (Open + Share)
        document.addEventListener('click', (e) => {
            const openBtn = e.target.closest('#qr-open-btn');
            const shareBtn = e.target.closest('#qr-share-btn');
            if (!openBtn && !shareBtn) return;
            const activeQR = allQRs.find(q => q.id === activeId);
            if (!activeQR) return;

            if (openBtn) {
                window.open(activeQR.url, '_blank');
            }
            if (shareBtn) {
                if (navigator.share) {
                    navigator.share({
                        title: activeQR.label || 'QR Code',
                        text: `Check out: ${activeQR.label}`,
                        url: activeQR.url
                    }).catch(() => { });
                } else {
                    navigator.clipboard.writeText(activeQR.url).then(() => {
                        alert('Link copied to clipboard!');
                    });
                }
            }
        });

        // ═══════════════════════════════════════════════
        // Tray Rendering
        // ═══════════════════════════════════════════════
        function renderTray() {
            const tray = document.getElementById('tray');
            const hint = document.getElementById('delete-hint');
            tray.innerHTML = '';

            allQRs.forEach(qr => {
                const item = document.createElement('div');
                item.className = 'tray-item' + (qr.id === activeId ? ' active' : '');
                item.innerHTML = (ICONS[qr.icon] || ICONS.custom) + `<span class="tray-item-label">${(qr.label || '').substring(0, 6)}</span>`;
                item.style.color = qr.id === activeId ? '#d7ba52' : '#a1a1aa';

                item.addEventListener('click', () => {
                    activeId = qr.id;
                    renderMainQR(qr);
                    renderTray();
                });

                // Long press to delete
                item.addEventListener('touchstart', () => {
                    longPressTimer = setTimeout(() => {
                        if (confirm(`Delete "${qr.label}"?`)) {
                            dbDelete(qr.id).then(() => {
                                allQRs = allQRs.filter(q => q.id !== qr.id);
                                if (activeId === qr.id) {
                                    activeId = allQRs.length > 0 ? allQRs[0].id : null;
                                    renderMainQR(allQRs[0] || null);
                                }
                                renderTray();
                            });
                        }
                    }, 600);
                }, { passive: true });
                item.addEventListener('touchend', () => clearTimeout(longPressTimer), { passive: true });
                item.addEventListener('touchmove', () => clearTimeout(longPressTimer), { passive: true });

                tray.appendChild(item);
            });

            // Add button
            const addBtn = document.createElement('div');
            addBtn.className = 'add-btn';
            addBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 4a1 1 0 011 1v6h6a1 1 0 110 2h-6v6a1 1 0 11-2 0v-6H5a1 1 0 110-2h6V5a1 1 0 011-1z"/></svg>`;
            addBtn.addEventListener('click', showPicker);
            tray.appendChild(addBtn);

            hint.style.display = allQRs.length > 1 ? 'block' : 'none';
        }

        // ═══════════════════════════════════════════════
        // Picker
        // ═══════════════════════════════════════════════
        function showPicker() {
            const overlay = document.getElementById('picker-overlay');
            const panel = document.getElementById('picker-panel');
            overlay.classList.add('show');
            setTimeout(() => panel.classList.add('show'), 10);
        }

        function hidePicker() {
            const overlay = document.getElementById('picker-overlay');
            const panel = document.getElementById('picker-panel');
            panel.classList.remove('show');
            setTimeout(() => overlay.classList.remove('show'), 300);
        }

        function buildPickerGrid() {
            const grid = document.getElementById('picker-grid');
            grid.innerHTML = '';
            PRESETS.forEach(preset => {
                const opt = document.createElement('div');
                opt.className = 'picker-option';
                opt.innerHTML = `
                    <div class="picker-icon">${ICONS[preset.key] || ICONS.custom}</div>
                    <span class="picker-label">${preset.label}</span>
                `;
                opt.addEventListener('click', () => {
                    selectedPreset = preset;
                    hidePicker();
                    showInputModal(preset);
                });
                grid.appendChild(opt);
            });
        }

        // ═══════════════════════════════════════════════
        // Input Modal
        // ═══════════════════════════════════════════════
        function showInputModal(preset) {
            const modal = document.getElementById('input-modal');
            document.getElementById('input-title').textContent = `Add ${preset.label} QR`;
            document.getElementById('input-subtitle').textContent = 'Paste the URL or text to encode';
            document.getElementById('input-label').value = preset.label;
            document.getElementById('input-url').value = '';
            document.getElementById('input-url').placeholder = preset.placeholder || 'https://...';
            setTimeout(() => {
                modal.classList.add('show');
                document.getElementById('input-url').focus();
            }, 350);
        }

        function hideInputModal() {
            document.getElementById('input-modal').classList.remove('show');
            selectedPreset = null;
        }

        async function saveNewQR() {
            const labelVal = document.getElementById('input-label').value.trim();
            const urlVal = document.getElementById('input-url').value.trim();
            if (!urlVal) return;

            const newQR = {
                id: 'qr_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
                label: labelVal || (selectedPreset?.label || 'QR'),
                icon: selectedPreset?.key || 'custom',
                url: urlVal,
                createdAt: Date.now()
            };

            await dbPut(newQR);
            allQRs.push(newQR);
            activeId = newQR.id;
            renderMainQR(newQR);
            renderTray();
            hideInputModal();

            // Scroll tray to end
            setTimeout(() => {
                const tray = document.getElementById('tray');
                tray.scrollLeft = tray.scrollWidth;
            }, 100);
        }

        // ═══════════════════════════════════════════════
        // Install Prompt — auto-show native install modal
        // ═══════════════════════════════════════════════
        let deferredPrompt = null;
        const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            // Auto-show install modal after 800ms (native install)
            if (!isStandalone) {
                setTimeout(() => {
                    document.getElementById('install-modal').classList.add('show');
                }, 800);
            }
        });

        document.getElementById('install-modal-btn').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                console.log('Install outcome:', outcome);
                deferredPrompt = null;
            } else {
                const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
                if (isIOS) {
                    alert('To install:\n1. Tap the Share button\n2. Tap "Add to Home Screen"');
                } else {
                    alert('To install:\n1. Open browser menu (⋮)\n2. Tap "Install" or "Add to Home Screen"');
                }
            }
            document.getElementById('install-modal').classList.remove('show');
        });

        document.getElementById('install-modal-dismiss').addEventListener('click', () => {
            document.getElementById('install-modal').classList.remove('show');
        });

        // iOS: auto-show modal with instructions
        if (/iPad|iPhone|iPod/.test(navigator.userAgent) && !isStandalone) {
            setTimeout(() => {
                document.getElementById('install-modal').classList.add('show');
            }, 800);
        }

        // ═══════════════════════════════════════════════
        // QR Scanner
        // ═══════════════════════════════════════════════
        let scannerStream = null;
        let scannerAnimFrame = null;
        let scannerActive = false;

        document.getElementById('scan-btn').addEventListener('click', startScanner);
        document.getElementById('scanner-close').addEventListener('click', stopScanner);
        let lastScannedData = '';

        document.getElementById('scanner-result-open').addEventListener('click', () => {
            const url = document.getElementById('scanner-result-text').textContent;
            if (url) window.open(url, '_blank');
        });

        document.getElementById('scanner-result-save').addEventListener('click', async () => {
            const data = document.getElementById('scanner-result-text').textContent;
            if (!data) return;
            const newQR = {
                id: 'qr_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
                label: 'Scanned QR',
                icon: data.startsWith('http') ? 'website' : 'custom',
                url: data,
                createdAt: Date.now()
            };
            await dbPut(newQR);
            allQRs.push(newQR);
            activeId = newQR.id;
            renderMainQR(newQR);
            renderTray();
            stopScanner();
        });

        async function startScanner() {
            const overlay = document.getElementById('scanner-overlay');
            const video = document.getElementById('scanner-video');
            const result = document.getElementById('scanner-result');
            result.classList.remove('show');
            lastScannedData = '';

            try {
                scannerStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
                });
                video.srcObject = scannerStream;
                overlay.classList.add('show');
                // Wait for video to be ready before playing
                video.onloadedmetadata = () => {
                    video.play().then(() => {
                        scannerActive = true;
                        requestAnimationFrame(scanFrame);
                    });
                };
            } catch (err) {
                console.error('Camera error:', err);
                alert('Camera access denied. Please allow camera permission to scan QR codes.');
            }
        }

        function scanFrame() {
            if (!scannerActive) return;
            const video = document.getElementById('scanner-video');
            const canvas = document.getElementById('scanner-canvas');
            const ctx = canvas.getContext('2d', { willReadFrequently: true });

            if (video.readyState === video.HAVE_ENOUGH_DATA && video.videoWidth > 0) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(imgData.data, imgData.width, imgData.height, { inversionAttempts: 'attemptBoth' });

                if (code && code.data && code.data !== lastScannedData) {
                    lastScannedData = code.data;
                    document.getElementById('scanner-result-text').textContent = code.data;
                    document.getElementById('scanner-result').classList.add('show');
                    // Don't auto-open — let user choose Open or Save
                    return; // Pause scanning after detection
                }
            }
            scannerAnimFrame = requestAnimationFrame(scanFrame);
        }

        function stopScanner() {
            scannerActive = false;
            if (scannerAnimFrame) cancelAnimationFrame(scannerAnimFrame);
            if (scannerStream) {
                scannerStream.getTracks().forEach(t => t.stop());
                scannerStream = null;
            }
            document.getElementById('scanner-overlay').classList.remove('show');
            document.getElementById('scanner-result').classList.remove('show');
        }

        // ═══════════════════════════════════════════════
        // Service Worker
        // ═══════════════════════════════════════════════
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/qr-sw.js')
                .then((reg) => {
                    if (reg.active || navigator.serviceWorker.controller) {
                        document.getElementById('offline-badge').style.display = 'inline-flex';
                    }
                    reg.addEventListener('updatefound', () => {
                        const sw = reg.installing;
                        sw.addEventListener('statechange', () => {
                            if (sw.state === 'activated') {
                                document.getElementById('offline-badge').style.display = 'inline-flex';
                            }
                        });
                    });
                })
                .catch(err => console.error('SW error:', err));

            if (navigator.serviceWorker.controller) {
                document.getElementById('offline-badge').style.display = 'inline-flex';
            }
        }

        // ═══════════════════════════════════════════════
        // Event Listeners
        // ═══════════════════════════════════════════════
        document.getElementById('picker-overlay').addEventListener('click', hidePicker);
        document.getElementById('input-cancel').addEventListener('click', hideInputModal);
        document.getElementById('input-save').addEventListener('click', saveNewQR);
        document.getElementById('input-url').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') saveNewQR();
        });

        // ═══════════════════════════════════════════════
        // INIT
        // ═══════════════════════════════════════════════
        (async function init() {
            await openDB();
            allQRs = await dbGetAll();

            // Sort by creation time
            allQRs.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));

            // Seed profile QR from URL params or localStorage
            const params = new URLSearchParams(window.location.search);
            let slug = params.get('slug') || '';
            let name = params.get('name') || '';

            if (slug) {
                localStorage.setItem('qr_widget_slug', slug);
                localStorage.setItem('qr_widget_name', name || 'My Profile');
            } else {
                slug = localStorage.getItem('qr_widget_slug') || '';
                name = localStorage.getItem('qr_widget_name') || 'My Profile';
            }

            if (slug) {
                const profileUrl = `https://canopycorp.in/#/p/${slug}`;
                const existingProfile = allQRs.find(q => q.id === 'profile_qr');

                if (!existingProfile) {
                    const profileQR = {
                        id: 'profile_qr',
                        label: decodeURIComponent(name || 'My Profile'),
                        icon: 'canopy',
                        url: profileUrl,
                        createdAt: 0 // Always first
                    };
                    await dbPut(profileQR);
                    allQRs.unshift(profileQR);
                } else {
                    // Update if slug changed
                    if (existingProfile.url !== profileUrl) {
                        existingProfile.url = profileUrl;
                        existingProfile.label = decodeURIComponent(name || 'My Profile');
                        await dbPut(existingProfile);
                    }
                }
            }

            // Set active
            activeId = allQRs.length > 0 ? allQRs[0].id : null;

            // Build UI
            buildPickerGrid();
            renderTray();
            renderMainQR(allQRs[0] || null);

            // Update page title
            if (slug) {
                document.title = `${decodeURIComponent(name || 'Canopy QR')} - Canopy QR`;
            }
        })();
    </script>
</body>

</html>
